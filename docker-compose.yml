services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartdoctor
      POSTGRES_USER: smartdoctor
      POSTGRES_PASSWORD: smartdoctor_dev_only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdoctor -d smartdoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: smartdoctor
      MONGO_INITDB_ROOT_PASSWORD: smartdoctor_dev_only
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "smartdoctor", "--password", "smartdoctor_dev_only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      APP_VERSION: 0.3.0
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://smartdoctor:smartdoctor_dev_only@postgres:5432/smartdoctor
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://smartdoctor:smartdoctor_dev_only@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: smartdoctor
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: patient_records
      EMBEDDING_DIMENSIONS: 384
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      UPLOAD_DIRECTORY: /data/uploads
      MAX_UPLOAD_MB: 20
      DEV_AUTH_ENABLED: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-local-dev}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    ports: ["8000:8000"]
    volumes: [smartdoctor_uploads:/data/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    volumes:
      - ./web:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on: [api]

volumes:
  postgres_data:
  mongodb_data:
  qdrant_data:
  redis_data:
  smartdoctor_uploads:
  web_node_modules:
