services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartdoctor
      POSTGRES_USER: smartdoctor
      POSTGRES_PASSWORD: smartdoctor_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdoctor -d smartdoctor"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
  web_node_modules:
